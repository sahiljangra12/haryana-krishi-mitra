name: Update mandi prices

on:
  schedule:
    # 06:40 and 12:40 UTC = 12:10 and 18:10 IST, after most mandis report
    - cron: "40 6,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  fetch:
    # data.gov.in only answers requests from India. GitHub's runners are abroad, so scheduled runs are
    # skipped (no failure emails, no wasted minutes) until the repo variable PRICE_PROXY points to an
    # India-based relay. A manual "Run workflow" always runs, for testing.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.PRICE_PROXY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Haryana mandi prices
        env:
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          PRICE_PROXY: ${{ vars.PRICE_PROXY }}
        run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add docs/data/prices.json docs/data/price_history.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update mandi prices $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
