  <header class="top">
    <a class="brand" href="#land" aria-label="Krishi Mitra Haryana">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="11" fill="#0c6b3c"/><path d="M8 27c7-1 13-6 15-15" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M12 31c9-1 17-8 19-19" stroke="#f5a300" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="27" cy="11" r="3" fill="#fff"/></svg>
      <div><h1 data-t="appName">कृषि मित्र</h1></div>
    </a>
    <div class="top-actions">
      <button id="voiceBtn" class="iconbtn" type="button" aria-label="Voice guide"><svg class="ic"><use href="#i-volume-x"/></svg></button>
      <button id="themeBtn" class="iconbtn" type="button" aria-label="Theme"><svg class="ic"><use href="#i-moon"/></svg></button>
      <button id="aboutBtn" class="iconbtn mobile-only" type="button" aria-label="About"><svg class="ic"><use href="#i-info"/></svg></button>
      <div class="lang" role="group" aria-label="Language"><button data-lang="hi">हिंदी</button><button data-lang="en">EN</button></div>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="land"><svg class="ic"><use href="#i-map-pin"/></svg><span class="long" data-t="tabLand"></span><span class="short" data-t="navLand"></span></button>
    <button class="tab" data-tab="advice"><svg class="ic"><use href="#i-sprout"/></svg><span class="long" data-t="tabAdvice"></span><span class="short" data-t="navAdvice"></span></button>
    <button class="tab" data-tab="soilcard"><svg class="ic"><use href="#i-flask-conical"/></svg><span class="long" data-t="tabCard"></span><span class="short" data-t="navCard"></span></button>
    <button class="tab" data-tab="techniques"><svg class="ic"><use href="#i-book-open-text"/></svg><span class="long" data-t="tabTech"></span><span class="short" data-t="navTech"></span></button>
    <button class="tab" data-tab="prices"><svg class="ic"><use href="#i-indian-rupee"/></svg><span class="long" data-t="tabPrices"></span><span class="short" data-t="navPrices"></span></button>
    <button class="tab" data-tab="weather"><svg class="ic"><use href="#i-cloud-sun"/></svg><span class="long" data-t="tabWeather"></span><span class="short" data-t="navWeather"></span></button>
    <button class="tab" data-tab="about"><svg class="ic"><use href="#i-info"/></svg><span class="long" data-t="tabAbout"></span><span class="short" data-t="navAbout"></span></button>
  </nav>
  <main>
    <section id="tab-land" class="panel active">
      <div class="stage">
        <div class="mapwrap">
          <div id="map"></div>
          <div class="maptop">
            <form id="searchForm" class="searchbar" role="search">
              <svg class="ic"><use href="#i-search"/></svg>
              <input id="q" type="search" data-tph="searchPh" autocomplete="off" enterkeyhint="search" aria-label="PIN code or village" />
              <button type="button" id="micBtn" class="sb-mic hidden" aria-label="Speak"><svg class="ic"><use href="#i-mic"/></svg></button>
              <button type="submit" class="sb-go" data-t="search"></button>
            </form>
            <div id="viewChips" class="viewchips"></div>
            <div id="searchResults" class="results"></div>
          </div>
          <div class="mapfab">
            <button id="fabIn" type="button" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
            <button id="fabOut" type="button" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
            <button id="fabLocate" type="button" aria-label="My location"><svg class="ic"><use href="#i-locate"/></svg></button>
          </div>
          <div id="legendBox" class="legend hidden"></div>
          <div id="imgBadge" class="imgbadge"></div>
          <div id="layerPanel" class="layerpanel hidden"></div>
        </div>
        <div id="guide" class="guide" aria-live="polite"></div>
      </div>
      <input id="acres" type="hidden" value="2" />
      <div class="below">
        <div id="installBox" class="install hidden"></div>
        <div id="report" class="report hidden"></div>
      </div>
    </section>

    <section id="tab-advice" class="panel">
      <div class="tabhead"><h2 data-t="tabAdvice"></h2><button class="say big" type="button" data-say="tab" data-tab="advice" aria-label="Listen"><svg class="ic"><use href="#i-volume-2"/></svg></button></div>
      <div class="card">
        <div class="row wrap">
          <label class="f"><span data-t="water"></span><select id="water"><option value="good" data-t="waterGood"></option><option value="limited" data-t="waterLimited"></option><option value="rainfed" data-t="waterRainfed"></option></select></label>
          <label class="f"><span data-t="risk"></span><select id="risk"><option value="low" data-t="riskLow"></option><option value="medium" data-t="riskMed" selected></option><option value="high" data-t="riskHigh"></option></select></label>
          <label class="f"><span data-t="season"></span><select id="seasonSel"></select></label>
          <label class="f"><span data-t="chooseDistrict"></span><select id="districtSel"></select></label>
        </div>
        <div id="adviceNote" class="notebar"></div>
        <fieldset class="opts">
          <legend><svg class="ic"><use href="#i-landmark"/></svg><span data-t="incentivesQ"></span></legend>
          <label><input type="checkbox" id="optPaddy" /> <span data-t="optPaddy"></span></label>
          <label><input type="checkbox" id="optDsr" /> <span data-t="optDsr"></span></label>
          <label><input type="checkbox" id="optStraw" /> <span data-t="optStraw"></span></label>
        </fieldset>
      </div>
      <div class="card" id="compareCard">
        <h2 data-t="compareTitle"></h2>
        <p class="hint" data-t="compareHint"></p>
        <div class="chartbox"><canvas id="compareChart"></canvas></div>
        <div id="riskSummary" class="summary-line"></div>
      </div>
      <div class="card">
        <h2 data-t="calendarTitle"></h2>
        <div class="calwrap"><div id="calendar" class="calendar"></div></div>
      </div>
      <div id="advice"></div>
      <p class="disclaimer" data-t="disclaimer"></p>
    </section>

    <section id="tab-soilcard" class="panel">
      <div class="tabhead"><h2 data-t="tabCard"></h2><button class="say big" type="button" data-say="tab" data-tab="soilcard" aria-label="Listen"><svg class="ic"><use href="#i-volume-2"/></svg></button></div>
      <div class="grid2">
        <div class="card">
          <h2 data-t="cardTitle"></h2>
          <p class="hint" data-t="cardIntro"></p>
          <label class="upload">
            <input type="file" id="cardFile" accept="image/*,application/pdf" capture="environment" />
            <svg class="ic"><use href="#i-camera"/></svg>
            <b data-t="cardUpload"></b>
            <span class="hint" data-t="cardFormats"></span>
          </label>
          <div class="row wrap">
            <button class="btn ghost" id="cardSample" type="button"><svg class="ic"><use href="#i-file-text"/></svg><span data-t="cardSample"></span></button>
            <button class="btn line" id="cardClear" type="button"><svg class="ic"><use href="#i-rotate-ccw"/></svg><span data-t="clear"></span></button>
          </div>
          <div id="cardProgress" class="progress hidden"><div class="bar"></div><span class="ptext"></span></div>
          <p class="hint"><svg class="ic"><use href="#i-shield-check"/></svg> <span data-t="cardPrivacy"></span></p>
          <img id="cardPreview" class="cardpreview hidden" alt="" />
        </div>
        <div class="card">
          <h2 data-t="cardValues"></h2>
          <p class="hint" data-t="cardCheck"></p>
          <div id="cardTable" class="params"></div>
        </div>
      </div>
      <div class="card" id="cardAdviceBox">
        <h2 data-t="cardFindings"></h2>
        <div id="cardAdvice"></div>
      </div>
      <div class="card">
        <h2 data-t="fertTitle"></h2>
        <div class="row wrap">
          <label class="f"><span data-t="filterCrop"></span> <select id="fertCrop"></select></label>
          <label class="f"><span data-t="acres"></span> <input id="fertAcres" type="number" min="0.25" step="0.25" value="2" /></label>
        </div>
        <div id="fertPlan"></div>
        <p class="hint" data-t="fertNote"></p>
      </div>
      <details class="card"><summary data-t="ocrRaw"></summary><pre id="ocrText" class="ocrtext"></pre></details>
    </section>

    <section id="tab-techniques" class="panel">
      <div class="tabhead"><h2 data-t="techTitle"></h2><button class="say big" type="button" data-say="tab" data-tab="techniques" aria-label="Listen"><svg class="ic"><use href="#i-volume-2"/></svg></button></div>
      <p class="hint" data-t="techIntro"></p>
      <input id="techSearch" type="search" data-tph="techSearch" />
      <div id="techChips" class="chips"></div>
      <div id="techList" class="techgrid" style="margin-top:1rem"></div>
    </section>

    <section id="tab-prices" class="panel">
      <div class="tabhead"><h2 data-t="tabPrices"></h2><button class="say big" type="button" data-say="tab" data-tab="prices" aria-label="Listen"><svg class="ic"><use href="#i-volume-2"/></svg></button></div>
      <div class="card">
        <h2 data-t="pricesTitle"></h2>
        <div class="row wrap">
          <label class="f"><span data-t="filterCrop"></span> <select id="priceCrop"></select></label>
          <label class="f"><span data-t="district"></span> <select id="priceDistrict"></select></label>
        </div>
        <p id="priceMeta" class="hint"></p>
        <div id="trendBox" class="hidden"><h3 data-t="trend"></h3><div class="chartbox"><canvas id="trendChart"></canvas></div></div>
        <div class="tablewrap"><table id="priceTable"></table></div>
      </div>
      <div class="card">
        <h2 data-t="mspTable"></h2>
        <div class="tablewrap"><table id="mspTable"></table></div>
        <p class="hint" id="mspSource"></p>
      </div>
    </section>

    <section id="tab-weather" class="panel">
      <div class="tabhead"><h2 data-t="tabWeather"></h2><button class="say big" type="button" data-say="tab" data-tab="weather" aria-label="Listen"><svg class="ic"><use href="#i-volume-2"/></svg></button></div>
      <div class="card">
        <div class="row wrap"><label class="f"><span data-t="district"></span> <select id="weatherDistrict"></select></label></div>
        <p id="weatherWhere" class="hint"></p>
        <h2 data-t="alerts"></h2>
        <div id="alerts"></div>
      </div>
      <div class="card">
        <h2 data-t="weatherTitle"></h2>
        <div id="forecast" class="forecast"></div>
      </div>
    </section>

    <section id="tab-about" class="panel">
      <div class="card prose" id="aboutBox"></div>
    </section>
  </main>

  <footer>
    <span data-t="footerData"></span>
    <a href="https://github.com/sahiljangra12/haryana-krishi-mitra" data-t="sourceCode"></a>
  </footer>

  <script type="module" src="js/app.js?v=20261120214327"></script>
</body>
</html>
